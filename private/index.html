<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1420" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'7'%20fill%3D'%230e1420'%2F%3E%3Cg%20fill%3D'none'%20stroke%3D'%23d9b45f'%20stroke-width%3D'2.4'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cg%20transform%3D'rotate(-35%2015%2011)'%3E%3Crect%20x%3D'8'%20y%3D'6'%20width%3D'14'%20height%3D'9'%20rx%3D'2'%2F%3E%3Cpath%20d%3D'M15%2015v12'%2F%3E%3C%2Fg%3E%3Cpath%20d%3D'M5%2027h12'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- Opt in to animated page changes here, not only in style.css, so the
         browser always sees it in time (an external stylesheet can be too late). -->
    <style>
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Wait for the card to exist before drawing, so the page transition can find it. -->
    <link rel="expect" href="#game" blocking="render" />
    <title>Private game · Pricey</title>
  </head>
  <body>
    <header class="nav">
      <a class="wordmark" href="../" aria-label="Pricey home">
        <svg class="wordmark-gavel" viewBox="0 0 32 32" aria-hidden="true">
          <g transform="rotate(-35 15 11)">
            <rect x="8" y="6" width="14" height="9" rx="2" />
            <path d="M15 15v12" />
          </g>
          <path d="M5 27h12" />
        </svg>
        Pricey
      </a>
      <nav class="nav-links">
        <div class="sound-controls" id="sound-controls"></div>
        <!-- Add links to new pages here -->
        <a href="../#how">How it works</a>
        <a href="../play/">Daily auction</a>
      </nav>
    </header>

    <main class="play">
      <div class="play-meta">
        <span class="label" id="play-title"></span>
        <div class="marks" id="marks" aria-hidden="true"></div>
      </div>
      <div
        class="leaderboard"
        id="leaderboard"
        aria-label="Standings"
        hidden
      ></div>
      <section class="puzzle-card" id="game" aria-live="polite"></section>
    </main>

    <script type="module" src="/src/private.ts"></script>
  </body>
</html>
